<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shutter Redesign</title>
<style>:root{
  --bg-0:#111113; --bg-1:#18181B; --bg-2:#202024; --bg-3:#2A2A2F; --bg-4:#34343A; --bg-5:#3E3E45;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12); --line-3:rgba(255,255,255,.2);
  --text:#EDEDF0; --text-2:#A6A6B0; --text-3:#74747E;
  --accent:#0A84FF; --accent-hover:#2F95FF; --accent-press:#0A6FDB; --accent-soft:rgba(10,132,255,.16); --accent-text:#6CB4FF;
  --danger:#FF5A50; --success:#32D74B; --warning:#FFD60A;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px;
  --shadow-pop:0 16px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.07);
  --shadow-win:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);
  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0B0D;color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
.ico{display:block;flex:none}

/* ---------- presentation page ---------- */
.doc{max-width:1560px;margin:0 auto;padding:56px 32px 120px}
.doc-head{display:flex;align-items:center;gap:20px;margin-bottom:12px}
.doc-head img{width:64px;height:64px}
.doc h1{font-size:34px;font-weight:600;letter-spacing:-.02em}
.doc .lede{color:var(--text-2);font-size:15px;line-height:1.6;max-width:820px;margin:8px 0 40px}
.sec{margin:72px 0 0}
.sec h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.sec .num{color:var(--text-3);font-variant-numeric:tabular-nums;margin-right:10px}
.sec p.note{color:var(--text-2);font-size:14px;line-height:1.6;max-width:860px;margin-bottom:20px}
.sec ul.note{color:var(--text-2);font-size:14px;line-height:1.6;max-width:860px;margin:0 0 20px 18px}
.stage{overflow-x:auto;padding:4px 0 8px}
.row{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{color:var(--text-3);font-size:12px;margin-top:10px}
.toc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 24px;color:var(--text-2);font-size:13px;max-width:900px}
.toc a{color:inherit;text-decoration:none}.toc a:hover{color:var(--text)}

/* ---------- frames (screenshot targets) ---------- */
.frame{position:relative;flex:none;overflow:hidden;border-radius:14px;background:#0E0E10}
.frame.desk{background:
  radial-gradient(1200px 700px at 15% 10%,#2b3a4a 0%,transparent 60%),
  radial-gradient(900px 600px at 90% 90%,#3a2f2a 0%,transparent 55%),
  linear-gradient(160deg,#1d2733,#141820 55%,#19161a)}
.frame.plain{background:#0E0E10;padding:40px;display:flex;align-items:center;justify-content:center}

/* ---------- windows & chrome ---------- */
.win{position:relative;background:var(--bg-1);border-radius:8px;box-shadow:var(--shadow-win);overflow:hidden;display:flex;flex-direction:column}
.titlebar{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding-left:10px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.titlebar .mark{width:18px;height:18px;margin-right:8px}
.titlebar .title{font-size:12.5px;color:var(--text);white-space:nowrap}
.titlebar .title small{color:var(--text-3);font-size:12px;margin-left:8px}
.titlebar .grow{flex:1;align-self:stretch}
.wc{display:flex;align-self:stretch;margin-left:6px}
.wc button{width:46px;border:0;background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center}
.wc button.x:hover,.wc button.x.hot{background:#C42B1C;color:#fff}
.vsep{width:1px;height:20px;background:var(--line-2);margin:0 6px;flex:none}

/* ---------- buttons ---------- */
.ib{width:32px;height:32px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib:hover,.ib.hov{background:var(--bg-4);color:var(--text)}
.ib.on{background:var(--accent-soft);color:var(--accent-text)}
.ib.dis{color:var(--text-3);opacity:.5}
.ib.sm{width:28px;height:28px}
.btn{height:30px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--bg-3);color:var(--text);font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.btn .ico{color:var(--text-2)}
.btn.hov{background:var(--bg-4)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:500}
.btn.primary .ico{color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.lg{height:34px;padding:0 16px;font-size:13px}
.split{display:inline-flex;flex:none}
.split .btn:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.split .btn:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;border-left:0;padding:0 6px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-xs);background:var(--bg-4);border:1px solid var(--line-2);border-bottom-width:2px;color:var(--text-2);font-size:10.5px;font-weight:600;font-family:var(--font);line-height:1}
.kbd.ghost{background:rgba(255,255,255,.06)}

/* ---------- editor ---------- */
.ed-body{flex:1;display:flex;min-height:0}
.rail{width:52px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.rail .ib{width:36px;height:36px;border-radius:var(--r-md)}
.rail .ib.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.rail .grp{width:24px;height:1px;background:var(--line-2);margin:6px 0}
.rail .grow{flex:1}
.ed-main{flex:1;display:flex;flex-direction:column;min-width:0}
.ctx{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg-1);border-bottom:1px solid var(--line)}
.ctx .tool{display:flex;align-items:center;gap:8px;color:var(--text);font-weight:500;font-size:12.5px;padding-right:2px}
.ctx .tool .ico{color:var(--accent-text)}
.ctx .lbl{color:var(--text-3);font-size:11.5px}
.ctx .hint{color:var(--text-3);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctx .grow{flex:1}
.chip-sel{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:500}
.chip-sel i{width:6px;height:6px;border-radius:3px;background:var(--accent)}

.swatches{display:flex;gap:6px;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;position:relative;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent)}
.sw.more{background:conic-gradient(#ff5a50,#ffd60a,#32d74b,#64d2ff,#0a84ff,#bf5af2,#ff5a50);}

.slider{display:flex;align-items:center;gap:10px}
.slider .track{position:relative;height:4px;border-radius:2px;background:var(--bg-4);width:110px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.slider .thumb{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5),0 0 0 3px rgba(10,132,255,.0)}
.slider .val{font-variant-numeric:tabular-nums;color:var(--text);font-size:12px;min-width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-xs);background:var(--bg-3);border:1px solid var(--line);padding:0 6px}

.seg{display:inline-flex;padding:2px;border-radius:var(--r-sm);background:var(--bg-0);border:1px solid var(--line);gap:2px;flex:none}
.seg b{font-weight:400;height:24px;padding:0 10px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12px;white-space:nowrap}
.seg b.on{background:var(--bg-4);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.seg b .ico{color:inherit}
.seg.icons b{padding:0 6px}

.canvas{flex:1;position:relative;background:var(--bg-0);overflow:hidden;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:16px 16px}
.status{height:28px;flex:none;display:flex;align-items:center;gap:12px;padding:0 6px 0 12px;background:var(--bg-2);border-top:1px solid var(--line);color:var(--text-2);font-size:12px}
.status .grow{flex:1}
.status .ib{width:24px;height:22px}
.status .zoom{font-variant-numeric:tabular-nums;min-width:42px;text-align:center;color:var(--text)}
.status .msg{display:flex;align-items:center;gap:8px}
.status .ok{color:var(--success)}
.dot{width:3px;height:3px;border-radius:2px;background:var(--text-3)}

/* tooltip */
.tip{position:absolute;z-index:20;background:#2C2C31;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;box-shadow:var(--shadow-pop);white-space:nowrap}
.tip .t{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text);font-weight:500}
.tip .d{color:var(--text-2);font-size:11.5px;margin-top:3px}

/* popover / menus */
.pop{position:absolute;z-index:30;background:#26262B;border-radius:var(--r-md);box-shadow:var(--shadow-pop);padding:5px}
.menu{min-width:240px}
.mi{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px 0 9px;border-radius:5px;color:var(--text);font-size:12.5px;white-space:nowrap}
.mi .ico{color:var(--text-2)}
.mi .sc{margin-left:auto;padding-left:24px;color:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.mi.hov{background:var(--bg-4)}
.mi.hov .ico{color:var(--text)}
.mi.danger{color:#FF8A82}.mi.danger .ico{color:#FF8A82}
.msep{height:1px;background:var(--line-2);margin:5px 4px}
.mhead{font-size:11px;color:var(--text-3);padding:7px 10px 4px;letter-spacing:.02em}

/* side panel */
.side{width:300px;flex:none;background:var(--bg-2);border-left:1px solid var(--line);display:flex;flex-direction:column}
.side-h{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.side-b{flex:1;overflow:hidden;padding:4px 14px 14px}
.side-f{height:52px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
.grp-t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:16px 0 10px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;color:var(--text-2);font-size:12.5px}
.field .slider .track{width:120px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{height:40px;border-radius:var(--r-sm);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.preset.on{outline:2px solid var(--accent);outline-offset:2px}
.preset-n{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:5px;color:var(--text-3);font-size:10.5px;text-align:center}
.colorbtn{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 5px;border-radius:var(--r-sm);background:var(--bg-3);border:1px solid var(--line-2);font-size:12px;color:var(--text);flex:1}
.colorbtn i{width:20px;height:20px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.colorbtn small{color:var(--text-3);font-family:var(--mono);font-size:11px;margin-left:auto}
.aspects{display:flex;flex-wrap:wrap;gap:6px}
.aspects b{font-weight:400;height:26px;padding:0 10px;display:inline-flex;align-items:center;border-radius:13px;background:var(--bg-3);border:1px solid var(--line);color:var(--text-2);font-size:12px}
.aspects b.on{background:var(--accent-soft);border-color:rgba(10,132,255,.5);color:var(--accent-text)}

/* toggle switch */
.switch{width:36px;height:20px;border-radius:10px;background:var(--bg-0);border:1px solid var(--line-3);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text-2)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:19px;background:#fff}

/* inputs */
.input{height:32px;border-radius:var(--r-sm);background:var(--bg-0);border:1px solid var(--line-2);border-bottom-color:rgba(255,255,255,.22);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--text);font-size:12.5px}
.input .ph{color:var(--text-3)}
.input.focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.input .ico{color:var(--text-3)}
.input .suffix{margin-left:auto;color:var(--text-3)}
.select{justify-content:space-between}
.check{width:18px;height:18px;border-radius:4px;border:1px solid var(--line-3);background:var(--bg-0);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* fake screenshot (light UI inside canvas) */
.shot{position:relative;background:#F6F7F9;color:#1d2330;font-family:Inter,var(--font);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4)}
.shot .s-top{height:44px;background:#fff;border-bottom:1px solid #e6e8ec;display:flex;align-items:center;padding:0 18px;gap:10px;font-weight:600;font-size:13px}
.shot .s-logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2bb673,#138a5b)}
.shot .s-nav{position:absolute;left:0;top:44px;bottom:0;width:180px;background:#fff;border-right:1px solid #e6e8ec;padding:14px 10px}
.shot .s-nav div{height:30px;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:#4b5363}
.shot .s-nav div.on{background:#eef6f1;color:#127a50;font-weight:600}
.shot .s-main{position:absolute;left:180px;top:44px;right:0;bottom:0;padding:22px 28px}
.shot h3{font-size:18px;font-weight:650;margin-bottom:4px}
.shot .sub{font-size:12.5px;color:#6b7280;margin-bottom:18px}
.shot .card{background:#fff;border:1px solid #e6e8ec;border-radius:10px;padding:16px 18px;margin-bottom:14px}
.shot .lbl2{font-size:11.5px;color:#6b7280;margin-bottom:6px;font-weight:500}
.shot .inp{height:32px;border:1px solid #d9dce2;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12.5px;background:#fff}
.shot .gbtn{height:32px;padding:0 14px;border-radius:7px;background:#16a066;color:#fff;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center}
.shot .obtn{height:32px;padding:0 14px;border-radius:7px;border:1px solid #d9dce2;background:#fff;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center}
.pix{position:absolute;display:grid;overflow:hidden;border-radius:2px}
.pix span{display:block}

/* annotations svg overlay */
.ann{position:absolute;inset:0;pointer-events:none;overflow:visible}
.handle{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.counter{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#FF453A;color:#fff;font:700 13px/26px Inter,var(--font);text-align:center;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}

/* capture overlay */
.dim{position:absolute;inset:0;background:rgba(5,5,8,.62)}
.pill{position:absolute;height:24px;padding:0 9px;border-radius:12px;background:rgba(20,20,22,.88);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:12px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pill.lg{height:34px;padding:0 14px;border-radius:17px;font-size:12.5px;gap:10px}
.pill .kbd{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#ddd}
.guide-h,.guide-v{position:absolute;background-image:linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 50%);background-size:8px 1px;height:1px}
.guide-v{width:1px;height:auto;background-image:linear-gradient(180deg,rgba(255,255,255,.55) 50%,transparent 50%);background-size:1px 8px}
.loupe{position:absolute;width:112px;border-radius:10px;overflow:hidden;background:#1b1b1e;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.18)}
.loupe .px{display:grid;grid-template-columns:repeat(11,1fr);width:112px;height:112px}
.loupe .px span{border-right:1px solid rgba(0,0,0,.12);border-bottom:1px solid rgba(0,0,0,.12)}
.loupe .cx{position:absolute;left:50%;top:56px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border:1.5px solid #fff;box-shadow:0 0 0 1px #000}
.loupe .meta{height:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:#ddd;font-variant-numeric:tabular-nums}

/* taskbar */
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(28,28,30,.92);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:4px;backdrop-filter:blur(20px)}
.tray-ic{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#ddd}
.tray-ic.on{background:rgba(255,255,255,.1)}
.clock{font-size:11.5px;color:#eee;text-align:right;line-height:1.35;padding:0 8px}

/* library */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,190px);gap:16px;padding:20px}
.card{width:190px;border-radius:var(--r-md);padding:6px;position:relative}
.card .th{height:120px;border-radius:6px;background:var(--bg-0);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.card .nm{font-size:12px;color:var(--text);margin:8px 4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:11px;color:var(--text-3);margin:0 4px 2px}
.card.hov{background:var(--bg-3)}
.card.sel{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.card .qa{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.card .qa span{width:26px;height:26px;border-radius:6px;background:rgba(20,20,22,.85);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#eee}
.mini{position:relative;background:#f4f5f7;border-radius:3px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* prefs */
.pref-side{width:208px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);padding:10px 8px}
.nav{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13px;position:relative}
.nav .ico{color:var(--text-3)}
.nav.on{background:var(--bg-4);color:var(--text)}
.nav.on .ico{color:var(--accent-text)}
.nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--accent)}
.pref-main{flex:1;padding:24px 28px;overflow:hidden}
.pref-main h4{font-size:20px;font-weight:600;margin-bottom:18px}
.setgrp{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:16px}
.setrow{min-height:56px;display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .ico{color:var(--text-2)}
.setrow .tx{flex:1}
.setrow .tx b{display:block;font-weight:400;font-size:13px;color:var(--text)}
.setrow .tx small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px}
.setgrp-t{font-size:12.5px;font-weight:600;color:var(--text);margin:4px 2px 8px}
.hk{min-width:150px;height:30px;border-radius:var(--r-sm);background:var(--bg-0);border:1px solid var(--line-2);display:flex;align-items:center;gap:4px;padding:0 6px 0 8px}

function arrowPath(x1, y1, x2, y2, w) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const head = Math.max(16, w * 4.2), hw = Math.max(9, w * 2.7), bx = x2 - ux * head, by = y2 - uy * head;
  const t0 = w * 0.3, t1 = w * 0.75;
  const P = [[x1 + nx * t0, y1 + ny * t0], [bx + nx * t1, by + ny * t1], [bx + nx * hw, by + ny * hw], [x2, y2], [bx - nx * hw, by - ny * hw], [bx - nx * t1, by - ny * t1], [x1 - nx * t0, y1 - ny * t0]];
  return 'M' + P.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';
}
function pixels(x, y, w, h, cell, seed) {

  return `<div class="pix" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;grid-template-columns:repeat(${cols},${cell}px);grid-auto-rows:${cell}px">${g}</div>`;
}

        <div style="font-size:20px;font-weight:600">Window heading 20 / Semibold</div><div style="font-size:13px;font-weight:600;margin-top:8px">Section 13 / Semibold</div><div style="font-size:13px;margin-top:6px">Body 13 / Regular</div><div style="font-size:12px;color:var(--text-2);margin-top:6px">Control label 12 / Regular</div><div style="font-size:11px;color:var(--text-3);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600">Group label 11 / Semibold caps</div></div>
      <div><div style="font-size:11px;color:var(--text-3);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600">Controls</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:520px"><button class="btn primary">${ic('copy', 16)}Copy</button><button class="btn">${ic('save', 16)}Save</button><button class="btn hov">Hover</button><button class="btn ghost">Ghost</button><button class="ib">${ic('pin', 18)}</button><button class="ib hov">${ic('pin', 18)}</button><button class="ib on">${ic('pin', 18)}</button><span class="switch on"></span><span class="switch"></span>${seg(['Outline', 'Soft', 'Solid'], 'Soft')}${slider(8, 20, 90)}${swatches('#0A84FF')}<span class="kbd">Ctrl</span><span class="kbd">Shift</span><span class="kbd">4</span></div></div>
      <div><div style="font-size:11px;color:var(--text-3);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600">Radius &amp; spacing</div>
        <div style="display:flex;gap:10px;align-items:flex-end">${[4, 6, 8, 12].map(r => `<div style="text-align:center"><div style="width:44px;height:44px;border-radius:${r}px;background:var(--bg-3);border:1px solid var(--line-2)"></div><div style="font-size:11px;color:var(--text-3);margin-top:6px">${r}</div></div>`).join('')}</div>
        <div style="display:flex;gap:8px;align-items:flex-end;margin-top:14px">${[4, 8, 12, 16, 24].map(s => `<div style="text-align:center"><div style="width:${s}px;height:${s}px;background:var(--accent);opacity:.7;border-radius:2px"></div><div style="font-size:11px;color:var(--text-3);margin-top:6px">${s}</div></div>`).join('')}</div></div>
    </div></div>`;
}

/* ------------------------------------------------------------ page */
const tipFor = (name) => { const t = TOOLS.find(x => x[0] === name); return `<div class="tip" data-tip="${name}" style="left:58px;top:0"><div class="t">${t[1]}${K(t[2])}</div><div class="d">${t[3]}</div></div>`; };
const S = [];
S.push({ id: 'editor-idle', t: 'Editor — screenshot open, nothing selected', n: 'A left tool rail replaces the two toolbar rows. Output (Copy, Save, Pin, Drag) and image modes (OCR, Backdrop) move into the custom title bar, where they’re always one click away and never compete with drawing tools. The context bar under the title bar shows only the options for the active tool — here the Arrow: colour and width, plus a reminder that Shift snaps to 45°. Hovering a rail button shows a tooltip with the tool name, its key and a one-line hint.',
  html: editor({ tool: 'arrow', hover: 'highlighter', ann: 'idle', scale: 1.08, ctx: ctx('arrow'), status: statusBar('1200 × 700 px<span class="dot"></span>4 annotations', '86%'), extra: tipFor('highlighter') }) });
S.push({ id: 'editor-selected', t: 'Editor — object selected', n: 'Selecting the red rectangle swaps the context bar to that object: a blue “Rectangle selected” chip makes it clear changes apply to the selection, not to the next shape. Fill appears because rectangles support it; for an arrow or freehand stroke it simply isn’t there. Delete is on the bar and on the Del key. The status bar confirms the copy that just happened.',
  html: editor({ tool: 'select', ann: 'selected', scale: 1.08, ctx: ctx('rect-selected'), status: statusBar('<span class="ok">' + ic('check', 14) + '</span>Copied to the clipboard', '86%') }) });
S.push({ id: 'editor-backdrop', t: 'Editor — backdrop panel', n: 'Backdrop becomes a right-hand side panel rather than a third toolbar row, so the canvas keeps its full height. Controls are grouped (Background → Frame → Canvas size) and only show what applies: Image and Wallpaper buttons and the Blur slider replace the gradient controls when Image is chosen; Angle and Linear/Radial only appear for gradients. The title bar Backdrop button stays lit while it’s on. At narrow widths the panel overlays the canvas instead of pushing it.',
  html: editor({ tool: 'arrow', backdrop: true, bdW: 860, bdH: 484, scale: .74, ctx: ctx('arrow'), status: statusBar('1328 × 747 px with backdrop<span class="dot"></span>16:9', '64%'), side: backdropPanel(), w: 1400 }) });
S.push({ id: 'editor-narrow', t: 'Editor at 900 px', n: 'At the minimum width the title bar folds Save, Pin, Drag and OCR into a ••• overflow menu, keeping Copy and Backdrop visible. The context bar drops its labels and moves secondary options (Fill, hints) into its own overflow. When the window is too short for all 15 tools, related tools stack into flyouts (a small corner notch marks them): Arrow/Line, Rectangle/Oval, Freehand/Highlighter, Blur/Spotlight and Ruler/Magnifier/Picker. Single-letter keys keep working whether a tool is visible or not.',
  html: editor({ tool: 'rect', ann: 'idle', scale: .8, narrow: true, w: 900, h: 600, ctx: ctx('narrow'), status: statusBar('1200 × 700', '64%') }) });
S.push({ id: 'tray', t: 'Tray menu & notifications', n: 'A Windows 11-style menu with icons and shortcuts, regrouped into capture → window → text → app. The header doubles as a reminder that left-click captures. The tray glyph is a flat aperture that reads at 16 px and turns blue while a capture is in progress. Notifications are a small custom toast with a thumbnail rather than a system balloon.',
  html: `<div class="row">${trayFrame()}${toastFrame()}</div>` });
S.push({ id: 'overlay-select', t: 'Capture overlay — mid-selection', n: 'The selection is a clear hole in a 55% dim layer, with a white/black hairline that reads on any background, dashed guides to the screen edges, and the size pill tucked under the bottom-right corner. A pixel loupe follows the cursor for precise edges and shows coordinates and the colour underneath. A one-time hint pill sits at the top; it fades after the first drag.',
  html: overlaySelecting() });
S.push({ id: 'overlay-idle', t: 'Capture overlay — before dragging', n: 'Full-screen dashed crosshair with a coordinates pill.', html: overlayIdle() });
S.push({ id: 'overlay-window', t: 'Capture overlay — any window', n: 'Hovering a window lifts it out of the dim layer with a 3 px accent outline and a label showing its title and size. Clicking captures it.', html: overlayWindow() });
S.push({ id: 'prefs-capture', t: 'Preferences — sidebar', n: 'The single scrolling column becomes six panes: General, Capture, Saving, Editor, Text & search and Hotkeys. Each setting is a row with a title, a one-line explanation and its control on the right — the Windows 11 Settings pattern. Changes apply immediately, so there’s no Save button; a search box finds any setting.',
  html: prefsCapture() });
S.push({ id: 'prefs-hotkeys', t: 'Preferences — hotkeys', n: 'Shortcuts render as keycaps. The box being recorded turns blue and says “Press a shortcut…”; a conflict would turn the box amber with the clashing action named underneath. Each row has a clear button, and the whole list can be restored.', html: prefsHotkeys() });
S.push({ id: 'prefs-editor', t: 'Preferences — editor', n: '', html: prefsEditor() });
S.push({ id: 'library', t: 'Library', n: 'Search is the hero of the title bar. Cards keep the ~190 px width, with thumbnails letter-boxed on a dark tile. Selected = accent ring and tint; hover reveals quick actions (Copy, Pin, more). The right-click menu matches the tray menu style. Filter chips and sort are optional extras; Change folder lives in the ••• menu.',
  html: libraryWin() });
S.push({ id: 'library-empty', t: 'Library — empty state', n: '', html: libraryEmpty() });
S.push({ id: 'preview', t: 'Preview card · Pin window · Scrolling capture', n: 'Preview: a 344 px card in the bottom-right corner. Hovering the thumbnail offers “Open in editor”; a thin accent line along the bottom counts down the 7 seconds and pauses on hover. Pin: borderless with a soft shadow; a zoom pill appears briefly while the wheel resizes it. Opacity is a segmented control inside the right-click menu. Scrolling capture: one floating strip, first choosing how to scroll, then showing a live recording dot, the captured height and a progress bar against the maximum height.',
  html: `<div class="row">${previewCard()}${pinFrame()}</div><div class="row" style="margin-top:28px">${scrollFrame(false)}${scrollFrame(true)}</div>` });
S.push({ id: 'resize', t: 'Resize dialog', n: 'A compact dialog with a chain-link toggle between width and height (it mirrors the Keep aspect ratio checkbox), presets as chips and the merge warning styled as a caution note.', html: resizeDialog() });
S.push({ id: 'icons', t: 'Icon set, app icon & tray icon', n: 'One family: 24 px grid, 1.6 px stroke, round caps and joins, drawn to sit beside Segoe Fluent Icons. Every icon is a plain SVG path, so it converts directly into a WPF Path or Geometry resource. The app icon is a six-blade aperture — the camera shutter — on a graphite tile. The tray icon is the same aperture as a flat glyph.',
  html: iconSheet() });
S.push({ id: 'tokens', t: 'Design tokens', n: 'Neutral graphite greys with a single blue accent. Blue marks state (active, selected, focus, primary action); it never decorates. The annotation colours stay saturated so they read on any screenshot.', html: tokenSheet() });

const toc = S.filter(s => s.n !== '' || s.id === 'overlay-idle').map((s, i) => `<a href="#${s.id}">${String(i + 1).padStart(2, '0')} · ${s.t.split(' — ')[0].split(' · ')[0]}${s.t.includes('—') ? ' — ' + s.t.split(' — ')[1] : ''}</a>`).join('');
let n = 0;
document.getElementById('doc').innerHTML = `
  <div class="doc-head">${appIconSvg(64)}<div><h1>Shutter — UI redesign</h1><div style="color:var(--text-3);margin-top:4px">Windows screenshot &amp; annotation utility · design proposal · October 2026</div></div></div>
  <p class="lede">A calm, graphite interface where the screenshot is the brightest thing on screen. Tools move into a vertical rail, output moves into a custom title bar, and every option appears only when the active tool or selected object can use it. One icon family, one accent and one set of components cover every window.</p>
  <div class="toc">${toc}</div>
  ${S.map(s => `<section class="sec" id="${s.id}"><h2><span class="num">${String(++n).padStart(2, '0')}</span>${s.t}</h2>${s.n ? `<p class="note">${s.n}</p>` : ''}<div class="stage" data-shot="${s.id}">${s.html}</div></section>`).join('')}
`;

document.querySelectorAll('.tip[data-tip]').forEach(tip => {
  const win = tip.closest('.win'); const b = win.querySelector('.rail [data-tool="' + tip.dataset.tip + '"]');
  const wr = win.getBoundingClientRect(), br = b.getBoundingClientRect();
  tip.style.top = (br.top - wr.top + br.height / 2 - tip.offsetHeight / 2) + 'px';
});
})();
</script></body></html>
